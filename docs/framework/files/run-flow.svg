<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="880" height="460" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">Run flow — dlouhá práce, co umí pokračovat po pádu</text>
  <text x="24" y="56" font-size="13" fill="#64748b">např. velký import, generování velkého reportu, dávkové zpracování — běží dlouho a po pádu pokračuje od posledně</text>

  <!-- 1. enqueue -->
  <rect x="24" y="88" width="160" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="104" y="114" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">1. Zařadíš práci</text>
  <text x="104" y="134" font-size="11" fill="#1d4ed8" text-anchor="middle">do fronty (v transakci)</text>

  <!-- 2. claim -->
  <rect x="216" y="88" width="160" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="296" y="114" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">2. Worker si ji vezme</text>
  <text x="296" y="134" font-size="11" fill="#1d4ed8" text-anchor="middle">označí „dělám na tom"</text>

  <line x1="184" y1="120" x2="216" y2="120" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="376" y1="120" x2="404" y2="140" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 3. running region (no tx) -->
  <rect x="406" y="80" width="450" height="180" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="631" y="104" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">3. BĚŽÍ DLOUHO — BEZ TRANSAKCE</text>

  <rect x="426" y="118" width="410" height="40" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="631" y="143" font-size="13" fill="#92400e" text-anchor="middle">Dělá práci krok po kroku (klidně minuty až hodiny)</text>

  <rect x="426" y="166" width="200" height="44" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="526" y="186" font-size="12.5" font-weight="600" fill="#92400e" text-anchor="middle">Uloží, kde skončil</text>
  <text x="526" y="202" font-size="10.5" fill="#b45309" text-anchor="middle">po každém kroku (checkpoint)</text>

  <rect x="636" y="166" width="200" height="44" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="736" y="186" font-size="12.5" font-weight="600" fill="#92400e" text-anchor="middle">Dá vědět, že žije</text>
  <text x="736" y="202" font-size="10.5" fill="#b45309" text-anchor="middle">občas (heartbeat)</text>

  <text x="631" y="234" font-size="11" fill="#b45309" text-anchor="middle">Proč bez transakce? Dlouhá práce v transakci by zamkla celou databázi pro všechny ostatní.</text>
  <text x="631" y="250" font-size="10.5" fill="#d97706" text-anchor="middle">(framework to navíc hlídá: otevřít tu transakci prostě nejde)</text>

  <!-- 4. done -->
  <rect x="216" y="300" width="430" height="44" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="431" y="320" font-size="13" font-weight="600" fill="#065f46" text-anchor="middle">4. Hotovo ✓   ·   Chyba → zkusí to znovu (s odstupem)</text>
  <text x="431" y="337" font-size="10.5" fill="#047857" text-anchor="middle">stav se odvodí ze sloupců v DB — žádný „status" sloupec</text>

  <line x1="631" y1="260" x2="500" y2="298" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 5. crash loop -->
  <path d="M216 322 C 90 322, 90 120, 214 120" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <rect x="220" y="376" width="440" height="44" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="440" y="396" font-size="12.5" font-weight="600" fill="#b91c1c" text-anchor="middle">Worker spadl uprostřed?</text>
  <text x="440" y="412" font-size="11" fill="#dc2626" text-anchor="middle">Jiný worker práci převezme a pokračuje od posledního uloženého kroku.</text>
</svg>
