<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">Run flow — durable run (mimo transakci)</text>
  <text x="24" y="56" font-size="13" fill="#64748b">enqueue v tx commandu · běh + checkpoint + heartbeat MIMO tx · po pádu reclaim + resume z checkpointu</text>

  <!-- Enqueue (in tx) -->
  <rect x="24" y="84" width="150" height="66" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="99" y="112" font-size="14" font-weight="600" fill="#065f46" text-anchor="middle">Enqueue</text>
  <text x="99" y="131" font-size="11.5" fill="#047857" text-anchor="middle">v tx commandu (outbox)</text>

  <!-- Claim -->
  <rect x="206" y="84" width="150" height="66" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="281" y="108" font-size="14" font-weight="600" fill="#1e40af" text-anchor="middle">Claim</text>
  <text x="281" y="126" font-size="11" fill="#1d4ed8" text-anchor="middle">owner token +</text>
  <text x="281" y="140" font-size="11" fill="#1d4ed8" text-anchor="middle">locked_until = now+lease</text>

  <line x1="174" y1="117" x2="206" y2="117" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- No-tx region -->
  <rect x="388" y="74" width="318" height="252" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="547" y="96" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">MIMO TRANSAKCI — BeginTx fail-closed</text>

  <!-- Handler -->
  <rect x="410" y="112" width="274" height="58" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="547" y="136" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">Handler (resume z r.State)</text>
  <text x="547" y="154" font-size="11" fill="#b45309" text-anchor="middle">LLM smyčka / kroky — minuty až hodiny, ctx-aware</text>

  <!-- Checkpoint -->
  <rect x="410" y="186" width="130" height="58" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="475" y="210" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">Checkpoint</text>
  <text x="475" y="227" font-size="10.5" fill="#b45309" text-anchor="middle">ck.Save — krátký</text>

  <!-- Heartbeat -->
  <rect x="554" y="186" width="130" height="58" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="619" y="210" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">Heartbeat</text>
  <text x="619" y="227" font-size="10.5" fill="#b45309" text-anchor="middle">renew lease/3</text>

  <text x="547" y="270" font-size="10.5" fill="#b45309" text-anchor="middle">stav přes Checkpointer · transakční side-work → enqueue command/job</text>

  <!-- Finalize -->
  <rect x="410" y="284" width="274" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="547" y="305" font-size="11.5" fill="#334155" text-anchor="middle">Finalize: MarkComplete · Reschedule(backoff) · MarkFailed</text>

  <line x1="356" y1="117" x2="406" y2="135" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Reclaim loop -->
  <path d="M410 300 C 250 360, 250 360, 281 152" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <rect x="300" y="350" width="300" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.3"/>
  <text x="450" y="367" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">Worker spadl → lease vyprší</text>
  <text x="450" y="382" font-size="11" fill="#dc2626" text-anchor="middle">jiný worker: Reclaim (reclaims++) + resume z r.State</text>
</svg>
