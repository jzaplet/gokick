<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="880" height="500" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">Background work — co kdy použít</text>
  <text x="24" y="56" font-size="13" fill="#64748b">dvě osy rozhodují: běží to v transakci? · synchronně v requestu, nebo asynchronně?</text>

  <!-- Axis labels -->
  <text x="300" y="92" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">SYNCHRONNĚ (request)</text>
  <text x="640" y="92" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">ASYNCHRONNĚ (worker / periodicky)</text>
  <text x="32" y="200" font-size="13" font-weight="700" fill="#065f46" transform="rotate(-90 32 200)" text-anchor="middle">V TRANSAKCI</text>
  <text x="32" y="370" font-size="13" font-weight="700" fill="#b45309" transform="rotate(-90 32 370)" text-anchor="middle">MIMO TRANSAKCI</text>

  <!-- Grid lines -->
  <line x1="130" y1="108" x2="130" y2="452" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="470" y1="108" x2="470" y2="452" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="130" y1="280" x2="856" y2="280" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Command (sync, in-tx) -->
  <rect x="148" y="124" width="300" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="166" y="150" font-size="15" font-weight="700" fill="#065f46">Command</text>
  <text x="166" y="172" font-size="11.5" fill="#047857">TransactionMiddleware — atomická write op.</text>
  <text x="166" y="190" font-size="11.5" fill="#047857">vytvoř / uprav / smaž entitu</text>
  <text x="166" y="214" font-size="11" fill="#059669">+ enqueue jobu/runu se připojí ke STEJNÉ tx</text>
  <text x="166" y="232" font-size="11" fill="#059669">(outbox: commit zviditelní, rollback vrátí)</text>
  <text x="166" y="252" font-size="10.5" fill="#10b981">drží request</text>

  <!-- Job (async, in-tx) -->
  <rect x="490" y="124" width="350" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="508" y="150" font-size="15" font-weight="700" fill="#065f46">Job</text>
  <text x="508" y="172" font-size="11.5" fill="#047857">runWithinTx — KRÁTKÁ tx, atomický complete</text>
  <text x="508" y="190" font-size="11.5" fill="#047857">krátká nespolehlivá práce: mail, externí API</text>
  <text x="508" y="214" font-size="11" fill="#059669">přežije restart i pád · retry + backoff</text>
  <text x="508" y="252" font-size="10.5" fill="#10b981">at-least-once → handler idempotentní</text>

  <!-- Event (sync, post-commit / no-tx) -->
  <rect x="148" y="296" width="300" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="166" y="322" font-size="15" font-weight="700" fill="#92400e">Doménový event</text>
  <text x="166" y="344" font-size="11.5" fill="#b45309">PO commitu, synchronně, bez ambient tx</text>
  <text x="166" y="362" font-size="11.5" fill="#b45309">(DispatchEvents obaluje Transaction)</text>
  <text x="166" y="386" font-size="11" fill="#d97706">„stalo se X" → reakce, kterou command nezná</text>
  <text x="166" y="416" font-size="10.5" fill="#f59e0b">pomalý handler blokuje response → enqueue</text>

  <!-- Run + Scheduler (async, no-tx) -->
  <rect x="490" y="296" width="350" height="86" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="508" y="322" font-size="15" font-weight="700" fill="#b91c1c">Durable run  ⟵ VYNUCENĚ mimo tx</text>
  <text x="508" y="344" font-size="11.5" fill="#dc2626">long-running „agent" — minuty/hodiny, checkpoint+resume</text>
  <text x="508" y="364" font-size="11" fill="#ef4444">dlouhý handler v tx by zamkl CELOU SQLite → freeze</text>

  <rect x="490" y="392" width="350" height="48" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="508" y="414" font-size="14" font-weight="700" fill="#92400e">Scheduler Fn</text>
  <text x="508" y="431" font-size="11" fill="#b45309">cron-like inline; těžké → enqueue job/run</text>

  <text x="24" y="478" font-size="11.5" fill="#64748b">Pravidlo: Command/Job tx MAJÍ (krátké). Run tx NESMÍ (dlouhý) — vynuceno: shared.ContextForbidTx → BeginTx fail-closed + conformance gate.</text>
</svg>
