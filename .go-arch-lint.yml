version: 3
workdir: app

allow:
  depOnAnyVendor: true
  # Deep scan analyzes method call graphs and flags cross-layer DI wiring
  # (e.g. testfx passing a security type to a bus middleware constructor).
  # Component-import rules alone are sufficient — disabling removes false
  # positives caused by dependency injection wiring.
  deepScan: false

exclude:
  - infrastructure/di/**

excludeFiles:
  - infrastructure/database/migration_manager.go

commonComponents:
  - domain

components:
  # Root
  app:
    in: .

  # Vrstva 1: Domain
  domain:
    in: domain/**

  # Vrstva 2: Application
  bus:
    in: application/bus
  bus_middleware:
    in: application/bus/middleware/**
  application:
    in: application/**
  # Matches any `testfx/` directory anywhere in the tree (e.g. application/auth/command/internal/testfx/).
  # Fixtures may wire real infrastructure — production code can import them from *_test.go files only.
  testfx:
    in: '**/testfx/**'

  # Vrstva 3: Infrastructure
  config:
    in: infrastructure/config/**
  database:
    in: infrastructure/database
  security:
    in: infrastructure/security/**
  sqlite_base:
    in: infrastructure/sqlite
  sqlite_repos:
    in: infrastructure/sqlite/**

  # Vrstva 4: Presentation
  handler:
    in: presentation/http/handler/**
  http_middleware:
    in: presentation/http/middleware/**
  response:
    in: presentation/http/response/**
  server:
    in: presentation/http/server/**
  console:
    in: presentation/console/**

deps:
  # Root – orchestrace
  app:
    mayDependOn:
      - bus
      - database
      - security
      - sqlite_base
      - console

  # Domain – čisté jádro
  domain:
    anyVendorDeps: true

  # Application – závisí jen na domain
  bus:
    anyVendorDeps: true
  bus_middleware:
    mayDependOn:
      - bus
  application:
    mayDependOn:
      - testfx
    anyVendorDeps: true

  # Test fixtures — may wire real infrastructure for integration tests.
  # Any layer that has tests can import them.
  testfx:
    mayDependOn:
      - bus
      - bus_middleware
      - database
      - security
      - config
      - sqlite_base
      - sqlite_repos
    anyVendorDeps: true

  # Infrastructure – závisí na domain
  config:
    anyVendorDeps: true
  database:
    mayDependOn:
      - config
  security:
    mayDependOn:
      - config
  sqlite_base:
    mayDependOn:
      - database
  sqlite_repos:
    mayDependOn:
      - sqlite_base
      - database

  # Presentation – závisí na application + infrastructure
  handler:
    mayDependOn:
      - application
      - bus
      - response
      - testfx
  http_middleware:
    mayDependOn:
      - security
      - response
      - testfx
  response:
    anyVendorDeps: true
  server:
    mayDependOn:
      - handler
      - http_middleware
      - config
  console:
    mayDependOn:
      - server
      - config
      - database
      - application
      - bus
