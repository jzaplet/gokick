name: Release

# Builds the production image on a v* tag and stamps the release version (the
# git tag) into the Go binary (main.release) and the SPA bundle
# (VITE_SENTRY_RELEASE) → the Sentry release.
#
# Pushing to GHCR is OFF by default — gokick is a template and a fork must not
# auto-publish. To publish, set a repository variable RELEASE_PUSH=true
# (Settings → Secrets and variables → Actions → Variables). No secret needed:
# GHCR auth uses the built-in GITHUB_TOKEN. With it unset the job still BUILDS
# the image (validating the release compiles) but does not push.
#
# Note: the first successful push creates the GHCR package PRIVATE by default.
# If you want anonymous `docker pull` of :latest, flip it to public once in the
# package settings (Package → Package settings → Change visibility).
#
# Tags don't trigger validate.yml, so this re-validates compilation only (the
# image build runs `go build` + `vite build`). Cut release tags from a green main.
#
# Two entry points, same build:
#   - push of a v* tag — the manual/hand-cut release path (full control).
#   - workflow_call from release-please.yml with the `tag` input — the automated
#     path (a GITHUB_TOKEN-pushed tag can't trigger `on: push: tags`, so
#     release-please calls this workflow instead). The build is identical either
#     way; only where the tag string comes from differs.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.2.3). Set by release-please; empty on a manual tag push."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build + push image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        id: rel
        # The workflow_call input when release-please called us; the pushed tag
        # otherwise. Everything downstream reads steps.rel.outputs.tag so neither
        # trigger has to special-case the version.
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          # Build the tagged commit. On a tag push this is where HEAD already is;
          # on workflow_call the tag was just created by release-please.
          ref: ${{ steps.rel.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      # Authenticate only when actually pushing.
      - name: Log in to GHCR
        if: vars.RELEASE_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Image tag = the raw git tag (e.g. v1.2.3). Both lines carry an explicit
          # `value=` so this resolves the same whether the trigger was a tag push
          # (github.ref is the tag) or a workflow_call (github.ref is main, so the
          # ref alone can't supply the version). type=raw guarantees the literal
          # tag even for a non-semver v*; type=semver enables `latest=auto`, which
          # moves :latest only for non-prerelease semver tags.
          tags: |
            type=raw,value=${{ steps.rel.outputs.tag }}
            type=semver,pattern={{raw}},value=${{ steps.rel.outputs.tag }}
          flavor: latest=auto

      - name: Build (push only when RELEASE_PUSH=true)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: ${{ vars.RELEASE_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.rel.outputs.tag }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # Frontend source-map upload to Sentry. Optional: with the secret unset
          # (template default) the Vite plugin no-ops and the build produces no
          # maps. Set repo secret SENTRY_AUTH_TOKEN + repo vars SENTRY_ORG /
          # SENTRY_PROJECT (the frontend project) to enable de-minified traces.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
