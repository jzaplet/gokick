name: Release

# Builds the production image on a v* tag and stamps the release version (the
# git tag) into the Go binary (main.release) and the SPA bundle
# (VITE_SENTRY_RELEASE) → the Sentry release.
#
# Pushing to GHCR is OFF by default — gokick is a template and a fork must not
# auto-publish. To publish, set a repository variable RELEASE_PUSH=true
# (Settings → Secrets and variables → Actions → Variables). No secret needed:
# GHCR auth uses the built-in GITHUB_TOKEN. With it unset the job still BUILDS
# the image (validating the release compiles) but does not push.
#
# Note: the first successful push creates the GHCR package PRIVATE by default.
# If you want anonymous `docker pull` of :latest, flip it to public once in the
# package settings (Package → Package settings → Change visibility).
#
# Nothing else validates a release commit. validate.yml is PR-only, and the release
# PR usually carries no checks of its own (see below), so this workflow runs the full
# suite itself against the exact commit being released, BEFORE any image is built —
# the `validate` job.
#
# On the release PR's checks: release-please opens it with GITHUB_TOKEN, and GitHub is
# mid-rollout on what that means. This repo has measured BOTH — release PRs #39/#41
# (2026-07-20) got runs in the `action_required` state that a maintainer approved by
# hand, while #43 (same day) and #55 (a month later) got none at all. Treat "the
# release PR validates the release" as something you cannot rely on either way; this
# gate is what does not depend on it.
#
# Two entry points, same build:
#   - workflow_call from release-please.yml with the `tag` input — the automated path.
#   - workflow_dispatch with the same input — the manual/hand-cut release, and the
#     recovery path when a gate failure left a tag with no image behind it.
#
# There is deliberately NO `on: push: tags: v*`. With GITHUB_TOKEN it never fired
# anyway (a token-pushed tag triggers nothing, which is why release-please calls this
# workflow directly). The moment release-please is given a PAT or App token it WOULD
# start firing — on top of the workflow_call — and two full runs would build and push
# the same GHCR tag for one release. Pushing a v* tag by hand therefore builds nothing
# on purpose; run this workflow with the tag instead:
#   gh workflow run release.yml -f tag=v1.2.3

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.2.3) — must already exist."
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.2.3). Set by release-please."
        required: true
        type: string

# One group per release version, across BOTH entry points — `inputs.tag` is set on
# either, so a manual re-run for a version cannot race the automated run for the same
# version. (The earlier `inputs.tag || github.ref` did NOT do this: it produced
# `release-v1.2.3` on one path and `release-refs/tags/v1.2.3` on the other, two groups
# that never serialised against each other.)
#
# cancel-in-progress is FALSE and must stay that way: a cancelled release build leaves
# a tag and a GitHub Release with no image behind them, which is worse than waiting.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # The gate. Runs lint + test + build + E2E against the commit this release is cut
  # from, using the same workflow the PR checks use — one definition, no second copy
  # to drift.
  #
  # `ref` is passed EXPLICITLY and is the whole point: a called workflow's default
  # checkout takes `github.sha`, which on the workflow_call path is the push-to-main
  # commit of the run that happened to cut the release — not necessarily the commit
  # the tag points at. (release-please reads live API state, so a run started by an
  # earlier push can be the one that tags.) Handing it the same tag the `image` job
  # builds makes the thing validated and the thing shipped the same object by
  # construction, instead of by an assumption about release-please's internals.
  #
  # Consequence, accepted deliberately: release-please TAGS before it calls this
  # workflow, so a failure here leaves a tag and a GitHub Release with no image
  # behind them. That is the lesser evil — a visibly incomplete release beats a
  # silently unvalidated one.
  #
  # RECOVERY — which move is right depends on WHY the gate failed, and the two cases
  # pull in opposite directions.
  #
  #   Transient failure (flaky module download, an API timeout, a runner dying): the
  #   commit is fine, so replaying it is exactly right. Use "Re-run failed jobs". It
  #   re-runs the gate and then `image` at the same SHA. Verified on webis-v5 release
  #   v1.0.0, where a proxy.golang.org read error failed the gate and attempt 2 went
  #   green and pushed the image — the successful release-please job's
  #   `release_created` output survives the partial re-run, so `image` is not skipped.
  #
  #   Real failure in the released code: re-running is useless — both buttons replay
  #   the SAME commit, so a fix landed on main changes nothing. Worse, "Re-run all
  #   jobs" on the automated path makes release-please see the release already cut
  #   (the merged PR carries the `autorelease: tagged` label), report
  #   release_created=false, and skip this workflow — green, having built nothing.
  #   What works: land the fix on main, let release-please cut the NEXT version, and
  #   treat the broken tag as a dud. To ship that exact version anyway, delete the tag
  #   and its GitHub Release, flip the merged release PR's label back to
  #   `autorelease: pending`, and re-run release-please.
  #
  # To rebuild an existing, known-good tag at any time, use workflow_dispatch:
  # `gh workflow run release.yml -f tag=vX.Y.Z`.
  validate:
    name: validate the release commit
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ inputs.tag }}

  image:
    name: build + push image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        id: rel
        # Both entry points now supply `tag` as a required input, so there is no
        # fallback to guess at. Everything downstream reads steps.rel.outputs.tag.
        run: echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          # Build the tagged commit. On a tag push this is where HEAD already is;
          # on workflow_call the tag was just created by release-please.
          ref: ${{ steps.rel.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      # Authenticate only when actually pushing.
      - name: Log in to GHCR
        if: vars.RELEASE_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Image tag = the raw git tag (e.g. v1.2.3). Both lines carry an explicit
          # `value=` so this resolves the same whether the trigger was a tag push
          # (github.ref is the tag) or a workflow_call (github.ref is main, so the
          # ref alone can't supply the version). type=raw guarantees the literal
          # tag even for a non-semver v*; type=semver enables `latest=auto`, which
          # moves :latest only for non-prerelease semver tags.
          tags: |
            type=raw,value=${{ steps.rel.outputs.tag }}
            type=semver,pattern={{raw}},value=${{ steps.rel.outputs.tag }}
          flavor: latest=auto

      - name: Build (push only when RELEASE_PUSH=true)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: ${{ vars.RELEASE_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.rel.outputs.tag }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # Frontend source-map upload to Sentry. Optional: with the secret unset
          # (template default) the Vite plugin no-ops and the build produces no
          # maps. Set repo secret SENTRY_AUTH_TOKEN + repo vars SENTRY_ORG /
          # SENTRY_PROJECT (the frontend project) to enable de-minified traces.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
