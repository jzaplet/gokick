name: Validate

# PR-ONLY, deliberately. PRs are rebase-merged onto an up-to-date branch, so the
# tree that lands on main is the tree these jobs already validated on the PR — a
# second run on the push to main re-tests identical content. Re-adding
# `push: branches: [main]` doubles every merge's CI bill and buys nothing back.
#
# What this repo does NOT rely on by default: required status checks. Not because
# they are wrong, but because what a GITHUB_TOKEN-created PR does is currently
# unpredictable — GitHub is rolling out "bot-created PRs can run workflows if
# approved", and THIS repo has measured both outcomes with the same token: release
# PRs #39/#41 got runs in the `action_required` state (a maintainer clicked approve),
# while #43 and #55 got none. A required context therefore either blocks forever or
# costs a click per release, and you cannot tell which in advance. Give release-please
# a PAT or App token and the picture becomes predictable — that is what
# `scripts/setup-github.sh --release-token` sets up. The honest consequence of the
# default: main can go momentarily red with nothing to announce it.
#
# What closes that gap is the release, not the merge. The `workflow_call` entry
# point below is release.yml's gate: it runs this whole suite against the exact
# commit being released, before any image is built. Nothing ships unvalidated even
# if something red reached main.
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit-ish to validate. release.yml passes the release TAG so the thing
          validated is the same object the image is built from — a called workflow's
          default checkout would take github.sha, which is the caller's event commit
          and not necessarily what the tag points at. Empty on the pull_request path,
          where checkout's own default (the PR merge ref) is correct.
        required: false
        type: string

# Supersede a PR's own in-flight run when it is pushed again — the older run is
# validating a commit nobody will merge. Grouped per ref (not per workflow alone)
# so two different PRs never cancel each other. `github.workflow` is the CALLER's
# name, so a release's gate run never shares a group with a PR run.
#
# Cancellation is deliberately OFF outside pull_request: on the workflow_call path
# this run is the gate a release image waits on, and killing it would abandon the
# tag release-please already cut.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # `make lint` would otherwise try to start the documan compose service in
  # the CI runner. Doc validation lives in its own pipeline:
  # `.github/workflows/documan.yml` (builds docker/documan/Dockerfile, whose
  # RUN step performs the lint).
  SKIP_DOCUMAN: "1"

jobs:
  validate:
    name: lint + test + build
    # Skip release-please's own PR: it only ever touches CHANGELOG.md and
    # .release-please-manifest.json, so building Go + the SPA and running the whole
    # suite over two text files is ~10 minutes of nothing.
    #
    # Dormant as shipped — with the default GITHUB_TOKEN that PR triggers no run at
    # all, so there is nothing here to skip. It goes live the moment release-please
    # is given a PAT or App token (the documented upgrade for anyone who also wants
    # required status checks), and it is a JOB-level `if` rather than a filter in
    # `on:` for two reasons that matter then: `on.pull_request.branches` filters the
    # BASE branch and cannot express "not release-please's branch" at all, and a job
    # skipped by `if` still reports its check while a filtered-out workflow reports
    # nothing.
    #
    # The `event_name != 'pull_request'` half is a guard, not decoration: on the
    # workflow_call path `github.head_ref` is empty, so the skip branch would already
    # not match — but if it ever did, both jobs would skip, this workflow would still
    # succeed, and release.yml's `needs:` gate would be satisfied by a run that
    # validated nothing. Green-and-empty is the one failure this gate must not have.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Empty on a pull_request — checkout then falls back to its own default
          # (the PR merge ref), which is what the PR checks must validate.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
        # No `cache: "yarn"` here — setup-node would call `yarn cache dir`
        # before corepack runs, and the globally-installed Yarn 1 refuses
        # because package.json pins `packageManager: yarn@4`. We cache via
        # actions/cache below instead.

      - name: Enable corepack
        run: corepack enable

      - name: Cache Yarn 4 (.yarn/cache)
        # `enableGlobalCache: false` in .yarnrc.yml keeps the cache local at
        # .yarn/cache so this action can target a stable path.
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache Go tools ($GOBIN binaries + build cache)
        # `make install-tools` runs 5 version-pinned `go install` commands (built
        # with the go.mod-pinned toolchain via GOTOOLCHAIN); each rebuilds a
        # transitive tree (golangci-lint alone is ~hundreds of packages). Caching
        # the resulting binaries + go-build cache makes subsequent runs
        # near-instant. The key includes hashFiles('Makefile'), so bumping a
        # pinned tool version invalidates the cache and reinstalls.
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/.cache/go-build
          key: go-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: go-tools-${{ runner.os }}-

      - name: Install (Go deps + tools + frontend deps)
        run: make install

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

  e2e:
    # Durable-run process-lifecycle E2E (kill -9 / SIGTERM against real serve
    # processes + a persistent SQLite file) — deliberately NOT part of `make test`,
    # so it runs as its own parallel job. Plain bash + jq + sqlite3, no Docker; the
    # scripts build bin/app themselves (go:embed * is satisfied by the committed
    # public/ files, no frontend build needed — E2E only talks to /health and
    # /debug/runs). See tests/e2e/README.md.
    name: durable-run E2E
    # Same reasoning as `validate` above — see the comment there for why this is a
    # job-level `if` rather than a filter in `on:`.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Empty on a pull_request — checkout then falls back to its own default
          # (the PR merge ref), which is what the PR checks must validate.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-e2e-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-e2e-${{ runner.os }}-

      - name: Ensure jq + sqlite3
        # Both ship in the ubuntu-latest image; this is a cheap no-op guard so an
        # image change fails loudly here instead of mid-script.
        run: sudo apt-get install -y --no-install-recommends jq sqlite3

      - name: E2E (crash recovery · at-least-once · SIGTERM drain · terminal failure)
        run: make e2e
